<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi/Lambda viewer</title>
<style>
:root{--bg:#0e1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--good:#3fb950}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header #subtitle{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;display:flex;min-height:0}
aside{width:260px;min-width:200px;border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 8px}
#artifacts{display:flex;flex-direction:column;gap:4px}
.artifact{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:7px 9px;border-radius:6px;cursor:pointer;font:inherit}
.artifact:hover{background:#21262d}
.artifact.selected{background:#1f6feb22;border-color:#1f6feb88}
.artifact .kind{color:var(--muted);font-size:11px;margin-left:6px}
.legend{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:5px}
.legend label{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer;font-size:12px}
.legend input{accent-color:var(--accent)}
.swatch{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
#hint{color:var(--muted);font-size:12px;margin-top:14px}
#drop{margin-top:18px;border:1px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted);font-size:12px;text-align:center}
#drop.hot{border-color:var(--accent);color:var(--accent)}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#plotWrap{flex:1;position:relative;min-height:0}
#gl,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{pointer-events:none}
#tooltip{position:absolute;pointer-events:none;background:#0d1117ee;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:12px;display:none;white-space:nowrap}
#gridControls{display:none;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);background:var(--panel)}
#gridControls.visible{display:flex}
#gridControls button{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer}
#gridControls input{flex:1;accent-color:var(--accent)}
#frameLabel{color:var(--muted);min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
#status{position:absolute;right:16px;bottom:12px;color:var(--muted);font-size:11px}
#gridControls.visible + #status{bottom:58px}
</style>
</head>
<body>
<header><h1>Pi/Lambda viewer</h1><span id="subtitle">loading…</span></header>
<main>
  <aside>
    <h2>Artifacts</h2>
    <div id="artifacts"></div>
    <div class="legend" id="legend"></div>
    <div id="hint">wheel: zoom · drag: pan · double-click: reset<br>drop CSV / TXT / JSON to plot</div>
    <div id="drop">Drop data here<br><small>CSV, numeric text, viewer JSON</small></div>
    <input id="fileInput" type="file" multiple hidden>
  </aside>
  <section id="stage">
    <div id="plotWrap">
      <canvas id="gl"></canvas>
      <canvas id="overlay"></canvas>
      <div id="tooltip"></div>
    </div>
    <div id="gridControls">
      <button id="play">Play</button>
      <input id="frameSlider" type="range" min="0" max="0" value="0">
      <span id="frameLabel"></span>
    </div>
    <div id="status"></div>
  </section>
</main>
<script src="viewer.js"></script>
</body>
</html>
